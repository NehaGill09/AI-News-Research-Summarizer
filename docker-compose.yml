services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: news_research
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: local_dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_user -d news_research"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://news_user:local_dev_password@db:5432/news_research
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  postgres_data:
